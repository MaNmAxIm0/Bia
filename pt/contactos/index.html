  <body data-page-title-key="contacts_page_title">
    <div id="header-placeholder"></div>
    <main class="page-content">
      <section class="section-contactos container">
        <h2 data-lang-key="contacts_section_title">Contactos</h2>
        <p class="section-description" data-lang-key="contacts_section_description">
          Entre em contacto comigo para colaborações, perguntas ou oportunidades profissionais. Utilize o formulário abaixo ou os contactos fornecidos.
        </p>
        <form class="contact-form" id="contact-form">
          <label for="name" data-lang-key="form_name_label">Nome:</label>
          <input type="text" id="name" name="name" required>
          <label for="email" data-lang-key="form_email_label">Email:</label>
          <input type="email" id="email" name="email" required>
          <label for="message" data-lang-key="form_message_label">Mensagem:</label>
          <textarea id="message" name="message" required></textarea>
          <button type="submit" data-lang-key="form_submit_button">Enviar</button>
        </form>
      </section>
    </main>
