        <p class="section-description" data-lang-key="contacts_section_description">
          Ponte en contacto conmigo para colaboraciones, preguntas u oportunidades profesionales. Utiliza el formulario a continuación o los contactos proporcionados.
        </p>
        <form class="contact-form" id="contact-form">
          <label for="name" data-lang-key="form_name_label">Nombre:</label>
          <input type="text" id="name" name="name" required />
          <label for="email" data-lang-key="form_email_label">Correo electrónico:</label>
          <input type="email" id="email" name="email" required />
          <label for="message" data-lang-key="form_message_label">Mensaje:</label>
          <textarea id="message" name="message" required></textarea>
          <button type="submit" data-lang-key="form_submit_button">Enviar</button>
        </form>
      </section>
